name: smartino
description: Smartino (صديقي الذكي) - An offline-first educational adventure for Egyptian children
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI and Animation
  cupertino_icons: ^1.0.2
  flutter_animate: ^4.2.0
  lottie: ^2.7.0
  confetti: ^0.7.0
  
  # Audio and Recording
  record: ^6.1.2
  audioplayers: ^5.2.1
  permission_handler: ^11.0.1
  
  # On-Device AI (Offline-First)
  flutter_tts: ^3.8.0
  speech_to_text: ^6.5.0
  
  # HTTP and API (Optional - for online features)
  http: ^1.1.0
  dio: ^5.3.2
  connectivity_plus: ^5.0.0
  
  # Local Storage (Offline-First)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  # Drawing and Canvas
  flutter_signature_pad: ^3.0.1
  
  # State Management
  provider: ^6.0.5
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  
  # Utilities
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  uuid: ^4.2.0
  
  # Charts for Parent Dashboard
  fl_chart: ^0.65.0
  
  # Haptic Feedback
  vibration: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.0
  riverpod_lint: ^2.3.0

flutter:
  uses-material-design: true
  
  assets:
    # Character Assets
    - assets/characters/farfour/
    
    # Background Images
    - assets/images/backgrounds/
    
    # Game Assets
    # - assets/images/games/balloons/
    # - assets/images/games/crowd/
    # - assets/images/games/missing_letter/
    # - assets/images/games/mixed_letters/
    # - assets/images/games/reading/
    
    # Letter Sounds
    - assets/letters/
    
    # UI Elements
    # - assets/images/ui/
    # - assets/images/icons/
    # - assets/images/particles/
    
    # General Images
    - assets/images/
    
    # Music
    - assets/sounds/music/
    
    # Sound Effects
    - assets/sounds/sfx/
    
    # Character Sounds
    # - assets/sounds/character/
    
    # Voice Lines
    - assets/sounds/voices/
    
    # General Sounds
    - assets/sounds/
    
    # Animations
    - assets/animations/
    # - assets/animations/farfour/
    
    # Data Files
    - assets/data/
  
  # Fonts removed - using system default fonts for better compatibility
